[project]
name = "minerva-ai-agent"
version = "0.1.0"
description = "Backend service for a human-supervised browser agent built on browser-use."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyio>=4.10.0",
    "browser-use>=0.8.1",
    "fastapi>=0.116.1",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
