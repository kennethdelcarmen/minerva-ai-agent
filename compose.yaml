services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      HEADLESS: "true"
      ARTIFACT_ROOT: /app/.runs
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/.runs:/app/.runs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
